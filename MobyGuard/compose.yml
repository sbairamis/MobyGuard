services:
  mobyguard:
    image: ghcr.io/sbairamis/mobyguard:${API_VERSION:-latest}
    restart: unless-stopped
    container_name: mobyguard
    ports:
      - "${API_PORT:-5090}:5090"
    volumes:
      - ${CERTS_DIR:-./certs}:/app/certs:ro
      - sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${SQLITE_CONN_STRING:-Data Source=/app/data/mobyguard.db}
      ConnectionStrings__RedisConnection: ${REDIS_CONN_STRING}
      RegistryTokenOptions__RegistryUrl: ${REGISTRY_URL}
      JwtOptions__SecurityKey: ${JWT_SECURITY_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - registry-net

  redis:
    image: redis:8.10-alpine
    container_name: mobyguard-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    command: >-
      redis-server
      --requirepass ${REDIS_PASS}
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  sqlite-data:

networks:
  registry-net:
    external: true
